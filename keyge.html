<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولد سريالات SecureVault</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        h2 {
            margin-top: 0;
            color: #38bdf8;
            font-size: 22px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #94a3b8;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #38bdf8;
        }
        button.btn-generate {
            width: 100%;
            padding: 12px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button.btn-generate:hover {
            background-color: #0369a1;
        }
        .result-box {
            margin-top: 24px;
            background-color: #0f172a;
            border: 1px dashed #475569;
            border-radius: 8px;
            padding: 14px;
            display: none;
        }
        .result-title {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 6px;
        }
        .serial-text {
            font-family: Consolas, monospace;
            font-size: 15px;
            color: #4ade80;
            word-break: break-all;
            user-select: all;
            margin-bottom: 10px;
        }
        .btn-copy {
            background-color: #334155;
            color: #f8fafc;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            width: 100%;
        }
        .btn-copy:hover {
            background-color: #475569;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>🔑 لوحة توليد السريالات</h2>

    <div class="form-group">
        <label for="hwid">معرف عتاد العميل (HWID):</label>
        <input type="text" id="hwid" placeholder="مثال: 4F2A1BC93E701982" autocomplete="off">
    </div>

    <div class="form-group">
        <label for="days">المدة بالأيام:</label>
        <input type="number" id="days" value="30" min="1">
    </div>

    <button class="btn-generate" onclick="generateSerial()">توليد السريال</button>

    <div class="result-box" id="resultBox">
        <div class="result-title">السريال الناتج:</div>
        <div class="serial-text" id="serialOutput"></div>
        <button class="btn-copy" id="copyBtn" onclick="copySerial()">📋 نسخ السريال</button>
    </div>
</div>

<script>
    // نفس المفتاح السري المستخدم للتوقيع داخل تطبيق بايثون
    const SECRET_BYTES = new Uint8Array([
        115, 118, 97, 117, 108, 116, 95, 104, 97, 114, 100, 101, 110, 101, 100, 95,
        109, 97, 115, 116, 101, 114, 95, 115, 105, 103, 110, 95, 50, 48, 50, 54
    ]);

    async function generateSerial() {
        const hwidInput = document.getElementById('hwid').value.trim().toUpperCase();
        const days = parseInt(document.getElementById('days').value, 10);

        if (!hwidInput) {
            alert('يرجى إدخال معرّف الجهاز (HWID).');
            return;
        }
        if (isNaN(days) || days < 1) {
            alert('يرجى إدخال عدد أيام صحيح.');
            return;
        }

        // حساب تاريخ الانتهاء (YYYYMMDD)
        const expiryDate = new Date();
        expiryDate.setDate(expiryDate.getDate() + days);
        const yyyy = expiryDate.getFullYear();
        const mm = String(expiryDate.getMonth() + 1).padStart(2, '0');
        const dd = String(expiryDate.getDate()).padStart(2, '0');
        const expiryStr = `${yyyy}${mm}${dd}`;

        const payload = `${hwidInput}:${expiryStr}`;

        // توليد HMAC-SHA256 باستخدام Web Crypto API
        const encoder = new TextEncoder();
        const key = await crypto.subtle.importKey(
            'raw',
            SECRET_BYTES,
            { name: 'HMAC', hash: 'SHA-256' },
            false,
            ['sign']
        );

        const signatureBuffer = await crypto.subtle.sign('HMAC', key, encoder.encode(payload));
        const hashArray = Array.from(new Uint8Array(signatureBuffer));
        const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        
        // أخذ أول 8 أحرف بصيغة كابيتال كما في كود بايثون
        const sig = hashHex.substring(0, 8).toUpperCase();

        const fullSerial = `SVAULT-${hwidInput}-${expiryStr}-${sig}`;

        // عرض النتيجة
        document.getElementById('serialOutput').innerText = fullSerial;
        document.getElementById('resultBox').style.display = 'block';
        document.getElementById('copyBtn').innerText = '📋 نسخ السريال';
    }

    function copySerial() {
        const serialText = document.getElementById('serialOutput').innerText;
        navigator.clipboard.writeText(serialText).then(() => {
            document.getElementById('copyBtn').innerText = 'تم النسخ بنجاح! ✔️';
        });
    }
</script>

</body>
</html>
